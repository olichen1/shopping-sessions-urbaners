name: Validate public dev dataset

on:
  push:
    branches:
      - "optimise/radix-sort-v1"
    paths:
      - ".github/workflows/inspect-test-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Download released test assets
        run: |
          mkdir -p /tmp/test-assets
          curl -fL --retry 3 "https://github.com/olichen1/shopping-sessions-urbaners/releases/download/test-data-v1/generator.zip" -o /tmp/test-assets/generator.zip
          curl -fL --retry 3 "https://github.com/olichen1/shopping-sessions-urbaners/releases/download/test-data-v1/dev-answer.zip" -o /tmp/test-assets/dev-answer.zip
          unzip -q /tmp/test-assets/generator.zip -d /tmp/generator-src
          unzip -q /tmp/test-assets/dev-answer.zip -d /tmp/expected
          ls -lh /tmp/test-assets /tmp/expected/dev-answer

      - name: Build the official public dev dataset
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cargo rustc python3-pip unzip
          cargo --version
          rustc --version
          cargo build --release --manifest-path /tmp/generator-src/generator/Cargo.toml
          /tmp/generator-src/generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output /tmp/dev
          find /tmp/dev -maxdepth 2 -type f -printf '%p %s bytes\\n' | sort

      - name: Build the exact submission Docker image
        run: docker build --platform linux/amd64 -t shopping-sessions-candidate .

      - name: Run candidate against generated dataset
        run: |
          mkdir -p /tmp/output
          /usr/bin/time -v docker run --rm \
            --cpuset-cpus=0-1 \
            -e DATA_DIR=/data -e OUTPUT_DIR=/output -e NCPU=2 \
            -v /tmp/dev:/data:ro -v /tmp/output:/output \
            shopping-sessions-candidate

      - name: Compare Parquet outputs with dev answer
        run: |
          python3 -m pip install --break-system-packages duckdb
          python3 check.py /tmp/output /tmp/expected/dev-answer

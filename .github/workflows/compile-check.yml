name: Compile and Docker build
on:
  push:
    branches:
      - "optimise/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++17 binary
        run: g++ -O2 -std=c++17 -pthread -static -Wall -Wextra -Wshadow -Wconversion -o /tmp/ss main.cpp
      - name: Build submission image
        run: docker build --platform linux/amd64 -t shopping-sessions-check .
